<svg xmlns="http://www.w3.org/2000/svg" width="800" height="160" viewBox="0 0 800 160">

  <defs>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="reveal">
      <rect x="0" y="0" width="0" height="160">
        <animate
          attributeName="width"
          values="0;800;800"
          keyTimes="0;0.7;1"
          dur="4s"
          repeatCount="indefinite"/>
      </rect>
    </clipPath>

  </defs>

  <g clip-path="url(#reveal)">

    <text
      x="400"
      y="100"
      text-anchor="middle"
      font-family="monospace"
      font-size="58"
      font-weight="bold"
      letter-spacing="2"
      fill="#4DFF88"
      filter="url(#glow)">

      Hi, I'm tenqo

    </text>

  </g>

</svg>
