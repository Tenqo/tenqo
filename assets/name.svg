<svg xmlns="http://www.w3.org/2000/svg"
     width="800"
     height="150"
     viewBox="0 0 800 150">

  <defs>

    <!-- Dark green text -->
    <linearGradient id="green" x1="0" x2="1">
      <stop offset="0%" stop-color="#6FAF7A"/>
      <stop offset="100%" stop-color="#3F8F52"/>
    </linearGradient>

    <!-- Reveal mask -->
    <clipPath id="reveal">
      <rect x="80" y="0" width="0" height="150">
        <animate
          attributeName="width"
          values="0;640;640"
          keyTimes="0;0.6;1"
          dur="4s"
          repeatCount="indefinite"/>
      </rect>
    </clipPath>

  </defs>


  <!-- NAME -->

  <g clip-path="url(#reveal)">

    <text
      x="400"
      y="88"
      text-anchor="middle"
      fill="url(#green)"
      font-family="monospace"
      font-size="54"
      font-weight="900"
      letter-spacing="1">

      Hi, I'm tenqo

    </text>

  </g>


  <!-- PIXEL-STYLE CURSOR -->

  <rect
    x="80"
    y="45"
    width="8"
    height="48"
    fill="#4F9B60"
    opacity="0">

    <animate
      attributeName="x"
      values="80;720;720"
      keyTimes="0;0.6;1"
      dur="4s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values="0;1;1;0"
      keyTimes="0;0.05;0.65;1"
      dur="4s"
      repeatCount="indefinite"/>

  </rect>


  <!-- SUBTLE UNDERLINE -->

  <rect
    x="250"
    y="112"
    width="300"
    height="2"
    fill="#356F42"
    opacity="0.8"/>

</svg>
