<svg width="1200" height="350" viewBox="0 0 1200 350" fill="none"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="350">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>

    <linearGradient id="textGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="smallGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- BACKGROUND -->

  <rect width="1200" height="350" rx="20" fill="url(#background)"/>


  <!-- ANIMATED GRID -->

  <g opacity="0.12" stroke="#38BDF8">

    <path d="M0 50H1200">
      <animate attributeName="opacity"
               values="0.05;0.2;0.05"
               dur="4s"
               repeatCount="indefinite"/>
    </path>

    <path d="M0 100H1200"/>
    <path d="M0 150H1200"/>
    <path d="M0 200H1200"/>
    <path d="M0 250H1200"/>
    <path d="M0 300H1200"/>

    <path d="M100 0V350"/>
    <path d="M200 0V350"/>
    <path d="M300 0V350"/>
    <path d="M400 0V350"/>
    <path d="M500 0V350"/>
    <path d="M600 0V350"/>
    <path d="M700 0V350"/>
    <path d="M800 0V350"/>
    <path d="M900 0V350"/>
    <path d="M1000 0V350"/>
    <path d="M1100 0V350"/>

  </g>


  <!-- CONNECTING LINES -->

  <g stroke="#38BDF8" stroke-width="1.5" opacity="0.35">

    <path d="M80 100 L280 170 L150 270 L380 290">
      <animate attributeName="stroke-dasharray"
               values="0,1000;500,500;1000,0"
               dur="6s"
               repeatCount="indefinite"/>
    </path>

    <path d="M1120 80 L920 150 L1080 260 L820 300">
      <animate attributeName="stroke-dasharray"
               values="0,1000;500,500;1000,0"
               dur="6s"
               repeatCount="indefinite"/>
    </path>

  </g>


  <!-- FLOATING PARTICLES -->

  <g fill="#38BDF8" filter="url(#smallGlow)">

    <circle cx="120" cy="80" r="3">
      <animate attributeName="cy"
               values="80;110;80"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="260" cy="260" r="4">
      <animate attributeName="cy"
               values="260;220;260"
               dur="4s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="970" cy="90" r="3">
      <animate attributeName="cy"
               values="90;130;90"
               dur="3.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1080" cy="240" r="4">
      <animate attributeName="cy"
               values="240;200;240"
               dur="4.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="850" cy="280" r="2">
      <animate attributeName="cy"
               values="280;250;280"
               dur="2.8s"
               repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- FLOATING CODE SYMBOLS -->

  <g fill="#38BDF8" opacity="0.6"
     font-family="monospace"
     font-size="24">

    <text x="150" y="150">&lt;/&gt;
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;0 -12;0 0"
        dur="4s"
        repeatCount="indefinite"/>
    </text>

    <text x="990" y="180">{ }</text>

    <text x="260" y="310">#</text>

    <text x="890" y="310">&lt;/&gt;</text>

  </g>


  <!-- MAIN TITLE -->

  <g filter="url(#glow)">

    <text x="600"
          y="165"
          text-anchor="middle"
          fill="url(#textGradient)"
          font-family="Arial, Helvetica, sans-serif"
          font-size="52"
          font-weight="700"
          letter-spacing="-1">

      Hi, I'm tenqo 👋

      <animate
        attributeName="opacity"
        values="0;0;1;1;1;0;0"
        dur="8s"
        repeatCount="indefinite"/>
    </text>

  </g>


  <!-- SUBTITLE -->

  <text x="600"
        y="215"
        text-anchor="middle"
        fill="#94A3B8"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20">

    Building cool apps, games &amp; projects.

    <animate
      attributeName="opacity"
      values="0;0;0;1;1;1;0"
      dur="8s"
      repeatCount="indefinite"/>
  </text>


  <!-- ANIMATED BOTTOM LINE -->

  <rect x="450"
        y="250"
        width="300"
        height="2"
        rx="1"
        fill="#38BDF8"
        filter="url(#smallGlow)">

    <animate
      attributeName="width"
      values="0;300;0"
      dur="5s"
      repeatCount="indefinite"/>

    <animate
      attributeName="x"
      values="600;450;600"
      dur="5s"
      repeatCount="indefinite"/>

  </rect>


  <!-- CORNER DECORATIONS -->

  <g stroke="#38BDF8" opacity="0.6" stroke-width="2">

    <path d="M35 80V35H80"/>
    <path d="M1120 35H1165V80"/>
    <path d="M35 270V315H80"/>
    <path d="M1120 315H1165V270"/>

  </g>

</svg>
